name: local_auth_windows
description: Dart-only stand-in for local_auth_windows (its native code no longer builds with VS 2026). Biometric lock is simply unavailable on Windows.
version: 1.0.99
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  local_auth_platform_interface: ^1.0.1

flutter:
  plugin:
    implements: local_auth
    platforms:
      windows:
        dartPluginClass: LocalAuthWindows
