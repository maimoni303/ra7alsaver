name: Build RA7AL Files Downloader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub.log || {
            tail -25 pub.log | sed 's/^/::error::/'
            exit 1
          }
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || {
            grep -E "^ *error" analyze.log | head -30 | sed 's/^ */::error::/'
            exit 1
          }

  windows:
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh windows
      - name: Build Windows
        run: |
          set -o pipefail
          flutter build windows --release --build-name=1.2.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.2.${{ github.run_number }} -v 2>&1 | tee build.log || {
            grep "error C\|error LNK\|error MSB\|CMake Error" build.log | sed 's/.*\(error [A-Z]*[0-9]*: .\{0,160\}\).*/\1/' | sort -u | head -9 | sed 's/^/::error::/'
            exit 1
          }
      - name: Package
        run: |
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/RA7AL-Files-Downloader-Windows.zip" . >/dev/null
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/RA7AL-Files-Downloader-Windows.zip

  macos:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh macos
      - run: flutter build macos --release --build-name=1.2.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.2.${{ github.run_number }}
      - name: Package DMG
        run: |
          mkdir -p dist dmg
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          codesign --force --deep --sign - "$APP" || true
          cp -R "$APP" "dmg/RA7AL Files Downloader.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "RA7AL Files Downloader" -srcfolder dmg -ov -format UDZO dist/RA7AL-Files-Downloader-macOS.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/RA7AL-Files-Downloader-macOS.dmg

  ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh ios
      - run: flutter build ios --release --no-codesign --build-name=1.2.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.2.${{ github.run_number }}
      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/RA7AL-Files-Downloader-iPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: ios
          path: dist/RA7AL-Files-Downloader-iPhone-unsigned.ipa

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh android
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --build-name=1.2.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=1.2.${{ github.run_number }} 2>&1 | tee build.log || {
            grep -E "error|Error|FAILURE|What went wrong|Exception" build.log | tail -25 | sed 's/^/::error::/'
            tail -40 build.log | sed 's/^/::warning::/'
            exit 1
          }
      - name: Package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/RA7AL-Files-Downloader-Android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: dist/RA7AL-Files-Downloader-Android.apk

  # Full end-to-end test of every page, tool and button on real phone systems.
  # Nothing is published unless both pass.
  test-android:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh android
      - name: Run the app test on an Android phone (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash -c 'set -o pipefail; flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee test.log'
      - name: Test report
        if: always()
        run: |
          { echo "## Android test report"; echo '```'; grep -E "(PASS|FAIL|WARN)  |^PASS \||^FAIL \||^WARN \||Passed [0-9]+ of" test.log || echo "no report (see the log)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAIL  " test.log | sed 's/^/::error::Android: /' || true
      - name: Keep the full log on the test-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 1500 test.log > "$RUNNER_TEMP/report.txt" 2>/dev/null || echo "no log" > "$RUNNER_TEMP/report.txt"
          cd "$RUNNER_TEMP" && rm -rf rep && git init -q rep && cd rep
          git config user.name "RA7AL CI" && git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4; do
            git fetch -q origin test-reports && git checkout -q -B test-reports FETCH_HEAD
            cp "$RUNNER_TEMP/report.txt" android.txt && git add android.txt
            git commit -qm "Android test report ${{ github.sha }}" || true
            git push -q origin test-reports && break
            sleep 5
          done

  test-ios:
    needs: analyze
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh ios
      - name: Start an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(c[-1]['udid'])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Run the app test on an iPhone (simulator)
        run: bash -c 'set -o pipefail; flutter test integration_test/app_test.dart -d "$UDID" --reporter expanded 2>&1 | tee test.log'
      - name: Test report
        if: always()
        run: |
          { echo "## iPhone test report"; echo '```'; grep -E "(PASS|FAIL|WARN)  |^PASS \||^FAIL \||^WARN \||Passed [0-9]+ of" test.log || echo "no report (see the log)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAIL  " test.log | sed 's/^/::error::iPhone: /' || true
      - name: Keep the full log on the test-reports branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 1500 test.log > "$RUNNER_TEMP/report.txt" 2>/dev/null || echo "no log" > "$RUNNER_TEMP/report.txt"
          cd "$RUNNER_TEMP" && rm -rf rep && git init -q rep && cd rep
          git config user.name "RA7AL CI" && git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4; do
            git fetch -q origin test-reports && git checkout -q -B test-reports FETCH_HEAD
            cp "$RUNNER_TEMP/report.txt" iphone.txt && git add iphone.txt
            git commit -qm "iPhone test report ${{ github.sha }}" || true
            git push -q origin test-reports && break
            sleep 5
          done

  release:
    needs: [windows, macos, ios, android, test-android, test-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/* \
            --target "${{ github.sha }}" \
            --title "RA7AL Files Downloader — أحدث إصدار" \
            --notes "نسخ ويندوز وماك وآيفون وأندرويد — اجتازت الاختبار الكامل على آيفون وأندرويد قبل النشر. طريقة التثبيت في ملف README."
          gh release delete android --cleanup-tag -y || true
          gh release create android dist/RA7AL-Files-Downloader-Android.apk \
            --target "${{ github.sha }}" \
            --title "RA7AL Files Downloader — أندرويد" \
            --notes "نزّل الملف على الجوال وافتحه، واسمح بالتثبيت من مصادر غير معروفة إذا طُلب منك."
