name: Build RA7AL SAVER

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || {
            grep -E "^ *error" analyze.log | head -30 | sed 's/^ */::error::/'
            exit 1
          }

  windows:
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh windows
      - name: Build Windows
        run: |
          set -o pipefail
          flutter build windows --release -v 2>&1 | tee build.log || {
            grep -E "error [A-Z]+[0-9]+|fatal error|Error:" build.log | grep -v "Structured output" | head -9 | sed 's/^/::error::/'
            exit 1
          }
      - name: Package
        run: |
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/RA7AL-SAVER-Windows.zip" . >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/RA7AL-SAVER-Windows.zip

  macos:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh macos
      - run: flutter build macos --release
      - name: Package DMG
        run: |
          mkdir -p dist dmg
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          codesign --force --deep --sign - "$APP" || true
          cp -R "$APP" "dmg/RA7AL SAVER.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "RA7AL SAVER" -srcfolder dmg -ov -format UDZO dist/RA7AL-SAVER-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/RA7AL-SAVER-macOS.dmg

  ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh ios
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/RA7AL-SAVER-iPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/RA7AL-SAVER-iPhone-unsigned.ipa

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_platforms.sh android
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            grep -E "error|Error|FAILURE|What went wrong|Exception" build.log | tail -25 | sed 's/^/::error::/'
            tail -40 build.log | sed 's/^/::warning::/'
            exit 1
          }
      - name: Package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/RA7AL-SAVER-Android.apk
      - name: Publish Android right away
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android --cleanup-tag -y || true
          gh release create android dist/RA7AL-SAVER-Android.apk \
            --target "${{ github.sha }}" \
            --title "RA7AL SAVER — أندرويد" \
            --notes "نزّل الملف على الجوال وافتحه، واسمح بالتثبيت من مصادر غير معروفة إذا طُلب منك."
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/RA7AL-SAVER-Android.apk

  release:
    needs: [windows, macos, ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/* \
            --target "${{ github.sha }}" \
            --title "RA7AL SAVER — أحدث إصدار" \
            --notes "نسخ ويندوز وماك وآيفون وأندرويد. طريقة التثبيت في ملف README."
