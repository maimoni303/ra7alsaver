name: ra7alsaver
description: RA7AL AL3OMR SAVER — free, open-source media saver and private file manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.5
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  gal: ^2.3.0
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dependency_overrides:
  # Native local_auth_windows fails on VS 2026; use a Dart-only stand-in.
  local_auth_windows:
    path: tool/stubs/local_auth_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
